name: Android (Google Play paketi)
on:
  push:
    branches: [main]
    paths: ['store/TETIK-ANDROID']
  workflow_dispatch:
    inputs:
      version_name:
        description: "Sürüm adı (ör. 1.0.0)"
        default: "1.0.0"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Görüş adresini yaz (repo değişkeni FEEDBACK_MAIL)
        env: { FM: "${{ vars.FEEDBACK_MAIL }}" }
        run: printf "window.FEEDBACK_MAIL='%s';\n" "$FM" > www/iletisim.js
      - name: Yayın öncesi kontrol (main dalı, özellikler eksiksiz, sürüm geri gitmiyor)
        env: { SURUM: "${{ inputs.version_name || '1.0.0' }}" }
        run: bash araclar/yayin-kontrol.sh
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npx cap sync android
      - name: Yükleme anahtarı (repo sırrı ANDROID_KEYSTORE_B64 varsa paket imzalı çıkar)
        env: { KS: "${{ secrets.ANDROID_KEYSTORE_B64 }}" }
        run: |
          if [ -n "$KS" ]; then printf '%s' "$KS" | base64 -d > $RUNNER_TEMP/upload.jks; echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> $GITHUB_ENV; echo "İmzalı derlenecek"; else echo "::warning::ANDROID_KEYSTORE_B64 yok, paket imzasız çıkacak"; fi
      - name: AAB derle
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ inputs.version_name || '1.0.0' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: yokusyolu
        run: chmod +x gradlew && ./gradlew bundleRelease --no-daemon
      - name: Paketi builds dalına koy
        run: |
          OUT=yokus-yolu-${{ inputs.version_name || '1.0.0' }}-${{ github.run_number }}.aab
          cp android/app/build/outputs/bundle/release/app-release.aab /tmp/$OUT
          mkdir -p /tmp/b/android && cp /tmp/$OUT /tmp/b/android/ && cd /tmp/b
          git init -q -b builds && git config user.name "github-actions" && git config user.email "actions@github.com"
          git add . && git commit -qm "Android paketi $OUT"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" builds
      - uses: actions/upload-artifact@v4
        with:
          name: yokus-yolu-${{ inputs.version_name || '1.0.0' }}-${{ github.run_number }}.aab
          path: android/app/build/outputs/bundle/release/app-release.aab
