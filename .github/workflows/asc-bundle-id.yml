name: App Store Connect — Bundle ID kaydet
# com.anduv.yokusyolu kimliğini Apple Developer hesabına kaydeder (zaten varsa dokunmaz).
# Sonra App Store Connect → Uygulamalar → + Yeni Uygulama ekranında bu kimlik listede çıkar.
on: workflow_dispatch
env:
  ASC_KEY_ID: DJSHKK6T3P
  ASC_ISSUER_ID: f4943ef8-df6f-42c8-a561-58554097ea35
  BUNDLE_ID: com.anduv.yokusyolu
  APP_NAME: Yokus Yolu
jobs:
  kaydet:
    runs-on: ubuntu-latest
    steps:
      - run: pip install pyjwt cryptography requests
      - name: Kaydet
        env: { P8: "${{ secrets.ASC_KEY_P8 }}" }
        run: |
          python3 - <<'PY'
          import os,time,jwt,requests
          tok=jwt.encode({'iss':os.environ['ASC_ISSUER_ID'],'iat':int(time.time()),'exp':int(time.time())+900,'aud':'appstoreconnect-v1'},os.environ['P8'],algorithm='ES256',headers={'kid':os.environ['ASC_KEY_ID'],'typ':'JWT'})
          H={'Authorization':'Bearer '+tok,'Content-Type':'application/json'}
          bid=os.environ['BUNDLE_ID']
          r=requests.get('https://api.appstoreconnect.apple.com/v1/bundleIds',params={'filter[identifier]':bid},headers=H).json()
          if [d for d in r.get('data',[]) if d['attributes']['identifier']==bid]:
              print('✓ Zaten kayıtlı:',bid)
          else:
              r=requests.post('https://api.appstoreconnect.apple.com/v1/bundleIds',headers=H,json={'data':{'type':'bundleIds','attributes':{'identifier':bid,'name':os.environ['APP_NAME'],'platform':'IOS'}}})
              print(r.status_code,r.text[:400]); r.raise_for_status(); print('✓ Kaydedildi:',bid)
          PY
