/* FM2010 menajer çizgisi (Nutuk Salonu / Vitrin ailesi): lacivert şeritli bant + kırmızı alt çizgi, krem kâğıt paneller */
:root{--ink:#1c2a44;--deep:#101c33;--red:#c8102e;--gold:#e0b04a;--paper:#fbf7ef;--panel:#fffdf8;--line:#e2d8c6;--head:#24406e;--teal:#0f766e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#0c1426;overflow:hidden;font:500 15px/1.4 'DM Sans',system-ui,sans-serif;color:var(--ink);touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.scr{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));z-index:3}
.scr.on{display:flex}
.panel{background:var(--paper);border-radius:14px;box-shadow:inset 6px 0 0 var(--red),0 6px 0 #8a5a2b55,0 20px 50px #000a;overflow:hidden;color:var(--ink)}
.hdr,.band{background:radial-gradient(ellipse at 18% -30%,#4a6fb8,transparent 60%),repeating-linear-gradient(90deg,#132545 0 60px,#162b52 60px 120px);box-shadow:0 3px 0 var(--red);color:#fff}
.hdr{padding:9px 14px 9px 20px;font:900 15px 'DM Sans',sans-serif;letter-spacing:.04em;display:flex;align-items:center;justify-content:space-between;gap:8px}
.hdr em,.band h1 em{font-style:normal;color:#f2c870}
.title{font:900 clamp(34px,8vw,64px)/1 'DM Sans',sans-serif;color:#fff;text-align:center;letter-spacing:-.01em}.title em{font-style:normal;color:#f2c870}
.crest{flex:none;width:40px;height:42px;border-radius:10px 10px 50% 50%;background:radial-gradient(circle at 35% 30%,#ff5a6a,var(--red) 62%,#7a0a1c);box-shadow:0 0 0 2px #fff;display:grid;place-items:center;font:900 11px 'DM Sans';color:#fff;letter-spacing:.02em}
.sig{font-size:12.5px;font-weight:800;color:#6b3d1c;letter-spacing:.02em}
.band .sig,.hdr .sig{color:#d3def3}
.btn{font:800 15px 'DM Sans',sans-serif;border:0;border-radius:10px;padding:10px 14px;background:linear-gradient(#f7f2e8,#ddd3c1);color:var(--ink);box-shadow:0 2px 0 #0004;cursor:pointer}
.btn:active{transform:translateY(1px);filter:brightness(1.05)}
.btn.go{color:#fff;background:linear-gradient(#ff6b7a,var(--red));box-shadow:0 3px 0 #7a0a1c;font:900 18px 'DM Sans';padding:12px 22px}
.btn.gold{background:linear-gradient(#ffe39a,var(--gold));color:#2a1d0c}
.btn.dis{opacity:.45;pointer-events:none}
#lang .box{width:min(440px,92vw);text-align:center}
#lang .band{padding:18px 14px 14px;display:flex;flex-direction:column;align-items:center;gap:6px}
#lang .body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px}
#lang .btn{font-size:20px;padding:13px}
#menu{padding:0;align-items:stretch}
#menu .mwrap{width:100%;height:100%;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 0%,rgba(31,58,110,.55),rgba(12,20,38,.82) 70%)}
#menu .band{display:flex;align-items:center;gap:10px;padding:calc(7px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right)) 7px max(14px,env(safe-area-inset-left))}
.band h1{margin:0;font:900 22px/1 'DM Sans',sans-serif}.band small{display:block;color:#d3def3;font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.band .t{min-width:0;flex:1}
.coins{display:flex;align-items:center;gap:6px;font:900 19px 'DM Sans';color:#2a1d0c;background:linear-gradient(#fff8e6,#efdcae);padding:4px 12px;border-radius:20px;box-shadow:0 2px 0 #0005}
.coin-i{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,#f0b829 45%,#9b6406);box-shadow:inset 0 0 0 2px #c58b12}
.tabs{display:flex;gap:4px;padding:8px max(12px,env(safe-area-inset-left)) 0;overflow-x:auto}
.tab{font:900 13.5px 'DM Sans';letter-spacing:.05em;padding:8px 14px;color:#d3def3;cursor:pointer;border-radius:10px 10px 0 0;background:#101c33cc;white-space:nowrap;text-transform:uppercase}
.tab.on{color:var(--ink);background:var(--paper);box-shadow:inset 0 3px 0 var(--red)}
.content{flex:1;min-height:0;overflow:auto;padding:10px max(12px,env(safe-area-inset-right)) 10px max(12px,env(safe-area-inset-left));background:var(--paper);margin:0 max(8px,env(safe-area-inset-right)) 0 max(8px,env(safe-area-inset-left));border-radius:0 12px 12px 12px;box-shadow:inset 6px 0 0 var(--red)}
.alt{display:flex;gap:8px;align-items:center;padding:8px max(12px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left));flex-wrap:nowrap;overflow-x:auto}
.alt .btn{flex:none;padding:9px 12px}.alt .sp{flex:1}.alt .sig{color:#d3def3;white-space:nowrap}
.fullchip{background:linear-gradient(#ffe39a,var(--gold))!important;color:#2a1d0c!important}
.cards{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px}
.card{flex:0 0 auto;width:200px;background:var(--panel);border-radius:12px;overflow:hidden;cursor:pointer;position:relative;box-shadow:0 0 0 1px var(--line),0 3px 0 #8a5a2b33}
.card.sel{box-shadow:0 0 0 3px var(--red),0 3px 0 #8a5a2b33}
.card canvas{display:block;width:100%;height:104px}
.card .ci{padding:7px 10px 9px}
.card .nm{font:900 17px 'DM Sans';color:var(--deep)}
.card .sb{font-size:12px;color:#4a3a22;min-height:15px}
.card .lk{position:absolute;inset:0 0 auto 0;height:104px;background:rgba(16,28,51,.55);display:flex;align-items:center;justify-content:center;font:900 15px 'DM Sans';color:#fff}
.stat{display:grid;grid-template-columns:62px 1fr;align-items:center;gap:6px;font-size:11px;color:#4a3a22;margin-top:3px}
.bar{height:7px;background:#e8dfcf;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--head),#4a6fb8)}
.row{display:grid;grid-template-columns:1.1fr 1fr 1.4fr auto;align-items:center;gap:10px;padding:9px 10px;border-bottom:1px solid var(--line)}
.row:nth-child(odd){background:var(--panel)}
.row .pn{font:900 16px 'DM Sans';color:var(--deep)}
.pips{display:flex;gap:4px}.pips i{width:16px;height:9px;background:#e8dfcf;border-radius:2px}.pips i.on{background:linear-gradient(#ff6b7a,var(--red))}
.eff{font-size:12px;color:#4a3a22}
.ghead{display:flex;gap:12px;align-items:center;padding:4px 4px 10px}
.ghead canvas{width:180px;height:96px;background:linear-gradient(180deg,#2b405f,#16223a);border-radius:10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px}
.chip{flex:none;width:132px;border-radius:10px;overflow:hidden;background:var(--panel);box-shadow:0 0 0 1px var(--line);cursor:pointer;position:relative}
.chip.sel{box-shadow:0 0 0 3px var(--red)}
.chip canvas{display:block;width:100%;height:58px}
.chip .cn{padding:4px 7px 6px;font:900 12.5px 'DM Sans';color:var(--deep);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .cp{display:block;font:700 11px 'DM Sans';color:#6b3d1c}
.chip.lock::after{content:'';position:absolute;inset:0;background:rgba(16,28,51,.5)}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px}
.bb{border:0;border-radius:10px;padding:6px 4px 5px;background:linear-gradient(#f7f2e8,#ddd3c1);color:var(--ink);box-shadow:0 2px 0 #0003;cursor:pointer;font:900 17px 'DM Sans';line-height:1.05;text-align:center}
.bb small{display:block;font:700 10px 'DM Sans';color:#6b3d1c;letter-spacing:.02em;text-transform:lowercase}
.bb .st{display:block;font-size:11px;color:var(--gold);letter-spacing:1px;min-height:12px;text-shadow:0 1px 0 #7a5a1a55}
.bb.cur{color:#fff;background:linear-gradient(#ff6b7a,var(--red));box-shadow:0 2px 0 #7a0a1c}.bb.cur small{color:#ffe0e4}
.bb.lock{opacity:.4;pointer-events:none}
.bb.fin{background:linear-gradient(#ffe39a,var(--gold))}
.note{padding:8px 2px 2px;color:#4a3a22;font-size:12.5px}
#hudBtns{position:fixed;top:max(8px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));display:none;gap:8px;z-index:5}
.ib{width:44px;height:44px;border-radius:50%;border:2px solid rgba(255,255,255,.7);background:rgba(16,28,51,.6);color:#fff;font:900 16px 'DM Sans';display:flex;align-items:center;justify-content:center;cursor:pointer}
.pedal{position:fixed;bottom:max(14px,env(safe-area-inset-bottom));width:clamp(90px,15vw,140px);height:clamp(110px,19vw,170px);display:none;z-index:4;cursor:pointer}
.pedal svg{width:100%;height:100%;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}
.pedal.down svg{transform:scale(.93) translateY(4px)}
#brk{left:max(14px,env(safe-area-inset-left))}
#gas{right:max(14px,env(safe-area-inset-right))}
#over .box,#pause .box,#fullp .box{width:min(480px,94vw);max-height:94vh;display:flex;flex-direction:column}
#over .body,#pause .body,#fullp .body{padding:12px 16px 14px 20px;display:flex;flex-direction:column;gap:8px;overflow:auto}
.big{font:900 40px/1 'DM Sans';text-align:center;color:var(--deep)}
.stars{text-align:center;font-size:30px;letter-spacing:6px;color:var(--gold);text-shadow:0 2px 0 #7a5a1a55;line-height:1}
.stars i{font-style:normal;color:#d9cfbd;text-shadow:none}
.reason{text-align:center;color:#8a4a1c;font-weight:800}
.kv{display:flex;justify-content:space-between;padding:6px 10px;background:var(--panel);border-radius:8px;font-size:14.5px;box-shadow:0 0 0 1px var(--line)}
.kv b{color:#8a4a1c}
.btns{display:flex;gap:8px;justify-content:center;margin-top:4px;flex-wrap:wrap}
#toast{position:fixed;left:50%;top:18%;transform:translateX(-50%);background:var(--paper);color:var(--ink);box-shadow:inset 5px 0 0 var(--red),0 8px 24px #0008;padding:9px 16px;border-radius:10px;font:900 16px 'DM Sans';display:none;z-index:9;max-width:90vw;text-align:center}
#setp .box,#help .box{width:min(560px,96vw);max-height:92vh;display:flex;flex-direction:column}
#setp .body,#help .body{padding:4px 0;overflow:auto}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 14px 9px 20px;border-bottom:1px solid var(--line)}
.setrow:nth-child(odd){background:var(--panel)}.setrow .btn{font-size:14px;padding:7px 12px}
.tip{display:flex;gap:10px;padding:9px 14px 9px 20px;border-bottom:1px solid var(--line);font-size:14px;line-height:1.35}.tip b{color:var(--deep);font:900 15px 'DM Sans'}
#coach{position:fixed;left:50%;top:max(84px,16vh);transform:translateX(-50%);max-width:min(460px,80vw);background:var(--paper);color:var(--ink);border-radius:12px;box-shadow:inset 6px 0 0 var(--red),0 10px 30px rgba(0,0,0,.5);padding:10px 14px 10px 20px;font-size:14.5px;line-height:1.35;display:none;z-index:6;pointer-events:none}
#coach b{display:block;font:900 16px 'DM Sans';color:var(--red);margin-bottom:2px}
#rateBox{display:none;background:var(--panel);box-shadow:0 0 0 1px var(--line);border-radius:10px;padding:9px 10px;text-align:center;font-size:14px}
#fullp .price{font:900 30px 'DM Sans';text-align:center;color:var(--red)}
#fullp ul{margin:0;padding-left:20px;font-size:14px;color:#4a3a22}
@media (max-height:440px){.card{width:178px}.card canvas,.card .lk{height:80px}.big{font-size:32px}.band h1{font-size:19px}.content{padding-top:8px}}
#rot{position:fixed;left:50%;top:60px;transform:translateX(-50%);font-size:12px;background:rgba(10,16,28,.7);padding:5px 10px;border-radius:12px;display:none;z-index:5;white-space:nowrap}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="lang" class="scr on">
  <div class="panel box">
    <div class="band"><div class="crest">1923</div><div class="title">Yokuş <em>Yolu</em></div><div class="sig">Bir Mr. Anduv! yapımıdır.</div></div>
    <div class="body">
      <div style="font-weight:900;color:#8a4a1c;letter-spacing:.06em;font-size:12.5px">DİL · LANGUAGE</div>
      <button class="btn go" data-l="tr">Türkçe</button>
      <button class="btn" data-l="en">English</button>
    </div>
  </div>
</div>

class Terrain{
 constructor(st,seed,harsh){this.st=st;this.seed=seed||st.seed;this.harsh=harsh||1;this.h=[];}
 raw(i){const st=this.st,tp=st.terr,s=this.seed,x=i*SEG,hs=this.harsh;
  if(x<520) return 0;
  const d=x-520, ramp=Math.min(1,d/2600), prog=Math.min(1,d/68000);
  const pa=Math.min(1.3,Math.pow(prog,.8)*hs+(hs-1)*.35);
  let h=(vn(d/2600,s)-.5)*700*tp.drift*ramp
   +(vn(d/760,s+1)-.5)*(90+300*pa)*tp.mid*ramp
   +(vn(d/240,s+2)-.5)*(30+110*pa)*tp.small*ramp
   +(vn(d/70,s+3)-.5)*(4+16*pa)*tp.bump*ramp;
  if(tp.terrace){const q=h/46,fl=Math.floor(q),fr=q-fl,u=clamp((fr-.25)/.5,0,1),sm=u*u*(3-2*u);h=lerp(h,(fl+sm)*46,.55*ramp);}
  return h;}
 H(i){if(i<0)return 0;let v=this.h[i];if(v===undefined){for(let k=this.h.length;k<=i;k++)this.h[k]=this.raw(k);v=this.h[i];}return v;}
 y(x){const i=Math.floor(x/SEG),t=x/SEG-i;return lerp(this.H(i),this.H(i+1),t);}
 normal(x){const i=Math.floor(x/SEG),dy=this.H(i+1)-this.H(i),l=Math.hypot(SEG,dy);return [-dy/l,SEG/l];}
 closest(px,py){let best=1e9,bx=0,by=0;const i0=Math.floor(px/SEG)-2,i1=Math.floor(px/SEG)+2;
  for(let i=i0;i<=i1;i++){const ax=i*SEG,ay=this.H(i),bxx=ax+SEG,byy=this.H(i+1);const dx=bxx-ax,dy=byy-ay;let t=((px-ax)*dx+(py-ay)*dy)/(dx*dx+dy*dy);t=clamp(t,0,1);const qx=ax+dx*t,qy=ay+dy*t,d=Math.hypot(px-qx,py-qy);if(d<best){best=d;bx=qx;by=qy;}}
  const under=py<this.y(px);let nx,ny;
  if(best<1e-4||under){[nx,ny]=this.normal(px);if(under)best=-best;}else{nx=(px-bx)/Math.abs(best);ny=(py-by)/Math.abs(best);}
  return {d:best,nx,ny};}
}

function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function ridge(c,w,h,off,base,amp,wl,s,fill,mesa){c.beginPath();c.moveTo(-2,h);for(let x=-2;x<=w+10;x+=8){let n=rn((x+off)/wl,s);if(mesa)n=Math.min(n,mesa)+Math.max(0,n-mesa)*.15;c.lineTo(x,base-n*amp);}c.lineTo(w+10,h);c.closePath();c.fillStyle=fill;c.fill();}
function ridgeY(x,off,base,amp,wl,s,mesa){let n=rn((x+off)/wl,s);if(mesa)n=Math.min(n,mesa)+Math.max(0,n-mesa)*.15;return base-n*amp;}
function tiles(w,off,tw,fn){const k0=Math.floor(off/tw)-1,k1=Math.floor((off+w)/tw)+1;for(let k=k0;k<=k1;k++)fn(k,k*tw-off);}
function vgrad(c,y0,y1,stops){const g=c.createLinearGradient(0,y0,0,y1);stops.forEach((s,i)=>g.addColorStop(i/(stops.length-1),s));return g;}

function drawTerrain(c,ter,st,w,h,ws,S,camX,camY,ox,oy){
 const x0=camX-ox/S-SEG*2,x1=camX+(w-ox)/S+SEG*2;const i0=Math.floor(x0/SEG),i1=Math.ceil(x1/SEG);
 const sx=x=>ox+(x-camX)*S,sy=y=>oy-(y-camY)*S;
 c.beginPath();c.moveTo(sx(i0*SEG),h+10);for(let i=i0;i<=i1;i++)c.lineTo(sx(i*SEG),sy(ter.H(i)));c.lineTo(sx(i1*SEG),h+10);c.closePath();
 let top=1e9;for(let i=i0;i<=i1;i+=4)top=Math.min(top,sy(ter.H(i)));
 c.fillStyle=vgrad(c,top,top+360*S,[st.ground.soil[0],st.ground.soil[1]]);c.fill();
 c.save();c.clip();
 for(let i=i0;i<=i1;i++){const r=hash(i,st.seed+200);if(r<.3){const x=i*SEG+hash(i,st.seed+201)*SEG,y=ter.H(i)-30-hash(i,st.seed+202)*170;c.fillStyle=st.ground.rock;c.globalAlpha=.5;c.beginPath();c.ellipse(sx(x),sy(y),(4+r*22)*S,(3+r*12)*S,r*3,0,7);c.fill();}
  if(r>.93){const x=i*SEG,y=ter.H(i)-60-hash(i,9)*120;c.globalAlpha=.25;c.fillStyle='#000';c.beginPath();c.ellipse(sx(x),sy(y),30*S,8*S,0,0,7);c.fill();}}
 c.globalAlpha=1;
 c.beginPath();for(let i=i0;i<=i1;i++){const X=sx(i*SEG),Y=sy(ter.H(i));i===i0?c.moveTo(X,Y):c.lineTo(X,Y);}
 c.lineJoin='round';c.strokeStyle='rgba(0,0,0,.18)';c.lineWidth=46*S;c.stroke();
 c.strokeStyle=st.ground.top;c.lineWidth=24*S;c.stroke();
 c.restore();
 c.beginPath();for(let i=i0;i<=i1;i++){const X=sx(i*SEG),Y=sy(ter.H(i));i===i0?c.moveTo(X,Y):c.lineTo(X,Y);}
 c.strokeStyle=st.ground.top2;c.lineWidth=3.5*S;c.stroke();
 if(st.ground.grass){c.strokeStyle=st.ground.grass===2?'#efd789':'#8fd35f';c.lineWidth=1.6*S;c.beginPath();for(let i=i0;i<=i1;i++){for(let j=0;j<3;j++){const x=i*SEG+j*8+hash(i*3+j,5)*6,y=ter.y(x),hh=(5+hash(i*3+j,6)*9)*S;c.moveTo(sx(x),sy(y)+1);c.lineTo(sx(x)+(hash(i,j)-.5)*6*S,sy(y)-hh);}}c.stroke();}
 if(st.ground.pool){for(let i=i0;i<=i1;i++){if(hash(i,77)>.86){const a=ter.H(i),b=ter.H(i+1);if(Math.abs(a-b)<3){const pg=c.createLinearGradient(0,sy(a)-2,0,sy(a)+6*S);pg.addColorStop(0,'#8ae9ee');pg.addColorStop(1,'#25b3c7');c.fillStyle=pg;c.beginPath();c.ellipse(sx(i*SEG+SEG/2),sy(a)+2*S,SEG*.55*S,3*S,0,0,7);c.fill();}}}}
}

function blip(f1,f2,d,type,vol){if(!AC||SAVE.muted)return;try{const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type=type||'sine';o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(vol||.08,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02);}catch(e){}}

/* Türkiye'den Türk dünyasına 10 sahne: 9×192 + 195 = 1923. Her bölüm bir görev; her sahnenin son bölümü 1923 m menzili. */
const BOLUM_N=1923;
const SAY=[192,192,192,192,192,192,192,192,192,195];
const STAGE_START=SAY.reduce((a,c,i)=>{a.push(i?a[i-1]+SAY[i-1]:1);return a;},[]);
const r10=v=>Math.round(v/10)*10;
const BCACHE={};
function bolum(n){if(BCACHE[n])return BCACHE[n];let s=0,k=n;while(s<SAY.length-1&&k>SAY[s]){k-=SAY[s];s++;}
 const cnt=SAY[s],p=k/cnt,d=n/BOLUM_N,st=STAGES[s];let type,target;
 if(k===cnt){type='menzil';target=1923;}
 else if(k%12===0){type='bidonsuz';target=r10(160+480*p+40*s);}
 else{type=['mesafe','akce','mesafe','takla','ucus'][(k-1)%5];if(k<6&&(type==='takla'||type==='ucus'))type='mesafe';
  if(type==='mesafe')target=r10(110+1350*Math.pow(p,1.08)+35*s);
  if(type==='akce')target=r10(100+1700*p+60*s);
  if(type==='takla')target=1+Math.floor(p*3.2+s*.15);
  if(type==='ucus')target=Math.round(2+p*8+s*.3);}
 const par=(type==='mesafe'||type==='bidonsuz'||type==='menzil')?target/15:(type==='akce'?target/30+25:type==='takla'?18+target*9:12+target*3.5);
 return BCACHE[n]={n,s,k,cnt,st,type,target,par,seed:st.seed*100+(k%24),harsh:.75+.55*d};}
function missionText(b){const t=b.target;return T('m_'+b.type).replace('{t}',fmt(t));}
function nextBolum(){let n=1;while(n<=BOLUM_N&&SAVE.done[n])n++;return n;}
function doneCount(){return Object.keys(SAVE.done).length;}
function starCount(){let s=0;for(const k in SAVE.done)s+=SAVE.done[k];return s;}
function stageDone(i){let c=0;for(let n=STAGE_START[i];n<STAGE_START[i]+SAY[i];n++)if(SAVE.done[n])c++;return c;}
function missionCur(g){const b=g.bol;if(!b)return 0;switch(b.type){case 'akce':return g.coinsCol;case 'takla':return g.flips;case 'ucus':return g.airTot;default:return g.maxDist;}}

function step(dt){
 const g=game,C=g.car,sp=C.sp,ter=g.ter;
 const gas=(!g.crashed&&g.fuel>0)?input.gas:0,brk=g.crashed?0:input.brake;
 const ca=Math.cos(C.a),sa=Math.sin(C.a);const KX=900,DX=12;
 let anyG=0;
 for(const w of C.wheels){
  const rx=ca*w.ax-sa*w.ay,ry=sa*w.ax+ca*w.ay,Ax=C.x+rx,Ay=C.y+ry;
  const vAx=C.vx-C.w*ry,vAy=C.vy+C.w*rx;const dx=w.x-Ax,dy=w.y-Ay,dvx=w.vx-vAx,dvy=w.vy-vAy;
  const lx=dx*ca+dy*sa,ly=-dx*sa+dy*ca,lvx=dvx*ca+dvy*sa,lvy=-dvx*sa+dvy*ca;
  let fx=-KX*lx-DX*lvx,fy=-sp.k*ly-sp.dmp*lvy;
  if(ly>6)fy-=3000*(ly-6)+30*lvy;if(ly<-34)fy+=3000*(-34-ly);
  const Fx=fx*ca-fy*sa,Fy=fx*sa+fy*ca;
  w.vx+=Fx/w.m*dt;w.vy+=(Fy/w.m+G)*dt;C.vx-=Fx/C.m*dt;C.vy-=Fy/C.m*dt;C.w+=(rx*(-Fy)-ry*(-Fx))/C.I*dt;
  if(w.drive){const torq=2*sp.F/(w.m*w.r);
   if(gas&&!brk){if(w.s<sp.spin)w.s+=torq*dt;}
   else if(brk){if(w.s>1)w.s-=Math.min(w.s,torq*1.3*dt);else if(w.s>-sp.spin*.4)w.s-=torq*.6*dt;}
   else w.s*=1-.5*dt;}
  else{ if(brk&&w.s>0)w.s-=Math.min(w.s,200*dt); w.s*=1-.3*dt;}
  if(w.ground)anyG=1;}
 C.vy+=G*dt;
 if(!anyG){const dir=(gas?1:0)-(brk?1:0);C.w+=dir*C.def.air*dt;}else if(gas){C.w+=(C.id==='toprak'?.3:.9)*dt;}
 C.w=clamp(C.w*(1-.25*dt),-7,7);
 C.x+=C.vx*dt;C.y+=C.vy*dt;C.a+=C.w*dt;
 const mu=sp.mu*g.st.grip;
 for(const w of C.wheels){w.x+=w.vx*dt;w.y+=w.vy*dt;w.th+=w.s*dt;w.ground=0;
  const q=ter.closest(w.x,w.y);if(q.d<w.r){const pen=w.r-q.d;w.x+=q.nx*pen;w.y+=q.ny*pen;let jn=0;const vn=w.vx*q.nx+w.vy*q.ny;if(vn<0){jn=-vn*w.m*1.05;w.vx+=q.nx*jn/w.m;w.vy+=q.ny*jn/w.m;}
   const tx=q.ny,ty=-q.nx,vt=w.vx*tx+w.vy*ty,slip=vt-w.s*w.r;let j=slip*w.m/3;const mj=mu*(jn+w.m*15*dt);j=clamp(j,-mj,mj);
   w.vx-=tx*j/w.m;w.vy-=ty*j/w.m;w.s+=2*j/(w.m*w.r);w.ground=1;w.slip=Math.abs(slip);w.nx=q.nx;w.ny=q.ny;}}
 const ca2=Math.cos(C.a),sa2=Math.sin(C.a);let hullHit=0;
 for(const h of C.def.hull){const rx=ca2*h[0]-sa2*h[1],ry=sa2*h[0]+ca2*h[1],px=C.x+rx,py=C.y+ry;const ty=ter.y(px);
  if(py<ty+2){hullHit=1;if(h[2]&&!g.crashed){g.crashed=1;g.crashT=0;g.reason='rHead';noise(.35,.3);blip(300,60,.4,'sawtooth',.1);g.shake=10;}
   const [nx,ny]=ter.normal(px),pen=(ty+2-py)*ny;const vPx=C.vx-C.w*ry,vPy=C.vy+C.w*rx,vn=vPx*nx+vPy*ny;
   if(vn<0){const rn_=rx*ny-ry*nx,eff=1/C.m+rn_*rn_/C.I,j=-1.15*vn/eff;C.vx+=nx*j/C.m;C.vy+=ny*j/C.m;C.w+=rn_*j/C.I;
    const tx=ny,ty2=-nx,vt=vPx*tx+vPy*ty2,rt=rx*ty2-ry*tx,et=1/C.m+rt*rt/C.I;let jt=-vt/et;jt=clamp(jt,-.5*j,.5*j);C.vx+=tx*jt/C.m;C.vy+=ty2*jt/C.m;C.w+=rt*jt/C.I;}
   C.x+=nx*pen*.8;C.y+=ny*pen*.8;}}
 if(C.def.id==='toprak'||true){const hx=C.x+ca2*C.head[0]-sa2*C.head[1],hy=C.y+sa2*C.head[0]+ca2*C.head[1];if(!g.crashed&&C.id==='toprak'&&ter.closest(hx,hy).d<11){g.crashed=1;g.reason='rHead';noise(.35,.3);g.shake=10;}}
 return {anyG,hullHit,gas};
}

function update(fdt){
 const g=game,C=g.car;if(g.slow>0){g.slow-=fdt;fdt*=.35;}const N=10,dt=fdt/N;let anyG=0,gas=0,hull=0;
 for(let i=0;i<N;i++){const r=step(dt);anyG|=r.anyG;gas=r.gas;hull|=r.hullHit;}
 g.t+=fdt;
 // fuel
 if(!g.crashed&&!g.won){g.fuel-=fdt*(.22+.78*(input.gas?1:0))/C.sp.tank;if(g.fuel<0)g.fuel=0;}
 const spd=Math.hypot(C.vx,C.vy);
 if(g.fuel<=0&&!g.crashed){g.outT+=fdt;if(spd<25&&g.outT>1.2||g.outT>14){g.crashed=1;g.crashT=.6;g.reason=C.def.fuel==='ev'?'rCharge':'rFuel';}}
 if(g.fuel<.2&&g.fuel>0&&g.t-g.lowWarn>2.5){g.lowWarn=g.t;blip(880,660,.15,'square',.04);}
 // air & flips
 if(!anyG&&!hull){g.air+=fdt;g.rot+=C.w*fdt;}else{if(g.air>.35&&!g.crashed){const fl=Math.floor((Math.abs(g.rot)+.9)/(Math.PI*2));if(fl>0){g.flips+=fl;const b=fl*150;addBonus(T('flip')+(fl>1?' x'+fl:''),b);}g.airTot+=g.air;if(g.air>1.3){const b=Math.round(g.air*25);addBonus(T('air')+' '+g.air.toFixed(1)+' '+T('sec'),b);}}g.air=0;g.rot=0;}
 coachTick(fdt);
 // distance
 g.dist=Math.max(0,(C.x-START_X)/PXM);g.maxDist=Math.max(g.maxDist,g.dist);
 if(!g.bol&&!g.hit1923&&g.maxDist>=1923){g.hit1923=1;addBonus('1923 m',1923);toast(T('m1923'));const i=STAGES.indexOf(g.st);if(i<STAGES.length-1&&!SAVE.stages[STAGES[i+1].id]){SAVE.stages[STAGES[i+1].id]=1;save();setTimeout(()=>toast(T('unlockedNext')+STAGES[i+1].name[L]),1800);}blip(523,1046,.5,'triangle',.1);}
 if(g.bol&&!g.won&&!g.crashed&&missionCur(g)>=g.bol.target){g.won=1;g.winT=0;const tt=g.t;g.stars=tt<=g.bol.par?3:tt<=g.bol.par*1.4?2:1;pop(T('bolWin')+'  '+'★'.repeat(g.stars),'#ffe27a');blip(523,1046,.5,'triangle',.12);setTimeout(()=>blip(659,1318,.4,'triangle',.1),180);}
 if(g.won){g.winT+=fdt;input.gas=0;if(g.winT>1.7&&!g.over){g.over=1;endRun();}}
 // Malaklı: yol kenarında bekler, araç geçince bir süre eşlik eder
 for(const d of g.dogs){if(!d.tr&&C.x>d.x-40&&Math.abs(C.x-d.x)<200){d.tr=1;d.run=3.2;blip(180,120,.18,'square',.06);setTimeout(()=>blip(170,110,.16,'square',.05),200);if(!g.dogPop){g.dogPop=1;addBonus(T('malakli'),25);}}
  if(d.run>0){d.run-=fdt;d.x+=Math.min(Math.max(C.vx*.95,0),560)*fdt;}}
 // pickups
 const near=(x,y,r)=>Math.hypot(C.x-x,C.y-y)<r||C.wheels.some(w=>Math.hypot(w.x-x,w.y-y)<r*.75);
 for(const co of g.coins){if(co.got||Math.abs(co.x-C.x)>160)continue;const cy=g.ter.y(co.x)+(co.big?70:46);if(near(co.x,cy,co.big?70:52)){co.got=1;coach('coin');g.coinsRun+=co.v;g.coinsCol+=co.v;blip(co.v>=100?1300:1000,co.v>=100?2200:1700,.09,'square',.035);for(let i=0;i<6;i++)g.parts.push({x:co.x,y:cy,vx:(Math.random()-.5)*200,vy:Math.random()*200,life:.5,max:.5,s:3,col:'#ffe27a',k:'sp'});}}
 for(const f of g.fuels){if(f.got||Math.abs(f.x-C.x)>160)continue;const fy=g.ter.y(f.x)+40;if(near(f.x,fy,60)){f.got=1;g.fuel=1;g.outT=0;pop(C.def.fuel==='ev'?T('chargeUp'):T('fuelUp'),'#8fe36b');blip(520,1040,.2,'triangle',.09);}}
 // particles
 for(const w of C.wheels){if(w.ground&&w.drive&&(Math.abs(w.s*w.r)>140||w.slip>120)&&Math.random()<.6){const col=g.st.id==='agri'?'rgba(255,255,255,':g.st.id==='pamukkale'?'rgba(240,240,232,':'rgba('+(g.st.ground.grass===1?'110,85,60,':'200,165,115,');g.parts.push({x:w.x-w.r*.6,y:w.y-w.r*.8,vx:-Math.sign(w.s)*(60+Math.random()*120)+C.vx*.2,vy:40+Math.random()*120,life:.7,max:.7,s:5+Math.random()*7,col,k:'dust'});}}
 if(input.gas&&!g.crashed&&C.def.fuel==='gas'&&g.fuel>0&&Math.random()<.5){const ca=Math.cos(C.a),sa=Math.sin(C.a);const ex=C.id==='toprak'?32:-84,ey=C.id==='toprak'?32:-14;g.parts.push({x:C.x+ca*ex-sa*ey,y:C.y+sa*ex+ca*ey,vx:C.vx*.3-ca*40+(C.id==='toprak'?0:-30),vy:C.vy*.3+60,life:.9,max:.9,s:4,col:'rgba(90,90,95,',k:'smoke'});}

   b.onclick=e=>{e.stopPropagation();if(!own){if(SAVE.coins>=car.price){SAVE.coins-=car.price;SAVE.cars[car.id]=1;SAVE.sel.car=car.id;save();blip(500,1000,.2,'triangle',.08);}}else SAVE.sel.car=car.id;save();renderMenu();};
   ci.appendChild(b);d.appendChild(ci);d.onclick=()=>{if(own){SAVE.sel.car=car.id;save();renderMenu();}};wrap.appendChild(d);});
  ct.appendChild(wrap);
  const note=document.createElement('div');note.className='note';note.textContent=T('driver');ct.appendChild(note);}
 else{const car=carById(SAVE.sel.car),u=upgOf(car.id);
  const hd=document.createElement('div');hd.className='ghead';const cvv=document.createElement('canvas');cvv.width=360;cvv.height=192;thumbCar(cvv,car);hd.appendChild(cvv);
  const inf=document.createElement('div');inf.innerHTML=`<div style="font:900 22px 'DM Sans';color:var(--deep)">${car.name}</div><div style="color:#4a3a22;font-size:13px">${car.desc[L]}</div>`;hd.appendChild(inf);ct.appendChild(hd);
  const tbl=document.createElement('div');
  const names={engine:T('engine'),susp:T('susp'),tires:T('tires'),tank:car.fuel==='ev'?T('battery'):T('tank')},effs={engine:T('effE'),susp:T('effS'),tires:T('effT'),tank:T('effF')};
  UPG.forEach(k=>{const r=document.createElement('div');r.className='row';const cost=upgCost(car,k);
   r.innerHTML=`<div class="pn">${names[k]}</div><div class="pips">${[0,1,2,3,4].map(i=>`<i class="${i<u[k]?'on':''}"></i>`).join('')}</div><div class="eff">${effs[k]}</div>`;
   const b=document.createElement('button');b.className='btn gold'+(cost===null||SAVE.coins<cost?' dis':'');b.style.cssText='font-size:14px;padding:7px 12px;min-width:92px';b.textContent=cost===null?T('max'):fmt(cost);
   b.onclick=()=>{if(cost!==null&&SAVE.coins>=cost){SAVE.coins-=cost;u[k]++;save();blip(400,900,.2,'triangle',.08);renderMenu();}};r.appendChild(b);tbl.appendChild(r);});
  ct.appendChild(tbl);}
}

let RUN={mode:'bolum',n:1};
function startBolum(n){if(n>nextBolum())return;if(needFull(n)){openFull(n);return;}RUN={mode:'bolum',n};startRun();}
function startFree(){RUN={mode:'serbest'};startRun();}
function startRun(){audioInit();if(AC&&AC.state==='suspended')AC.resume();newGame();state='play';show(null);$('gasT').textContent=T('gas');$('brkT').textContent=T('brake');$('rot').textContent=T('rotate');lastT=performance.now();
 if(game.bol&&SAVE.tips.gas)coach('mission');}
function goNext(){const nx=nextBolum();if(nx>BOLUM_N){startFree();return;}startBolum(nx);}
function endRun(){const g=game;engineSet(false,0,0);
 const rec=g.maxDist>(SAVE.best[g.st.id]||0);if(rec)SAVE.best[g.st.id]=g.maxDist;
 let reward=0,stars=0,win=!!g.won;const b=g.bol;
 if(b&&win){stars=g.stars;reward=40+Math.round(b.n*1.5)+stars*25;const prev=SAVE.done[b.n]||0;if(stars>prev)SAVE.done[b.n]=stars;if(!prev)reward+=0;else reward=Math.round(reward*.4);g.bonus.push([T('bolReward'),reward]);g.coinsRun+=reward;}
 SAVE.coins+=g.coinsRun;save();
 state='over';
 if(b){$('oH').textContent=`${T('bolum')} ${b.n}`;$('oStage').textContent=b.st.name[L];
  $('oDist').textContent=win?(b.n===BOLUM_N?T('finalWin'):T('bolWin')):T('bolFail');
  $('oStars').innerHTML=win?starStr(stars):'';$('oReason').textContent=win?missionText(b)+' ✓':T(g.reason||'rFuel')+' · '+missionText(b);}
 else{$('oH').textContent=T('over');$('oStage').textContent=g.st.name[L];$('oDist').textContent=Math.floor(g.maxDist)+' m';$('oStars').innerHTML='';$('oReason').textContent=T(g.reason||'rFuel')+(rec?'  ·  '+T('newRec'):'');}
 let html=`<div class="kv"><span>${T('dist')}</span><b>${Math.floor(g.maxDist)} m${rec?' · '+T('newRec'):''}</b></div><div class="kv"><span>${T('coins')}</span><b>${fmt(g.coinsCol)}</b></div>`;
 if(g.bonus.length){const agg={};g.bonus.forEach(([n,v])=>{const key=n.replace(/ [\d.]+ (sn|s)$/,'');agg[key]=(agg[key]||0)+v;});for(const k in agg)html+=`<div class="kv"><span>${k}</span><b>+${fmt(agg[k])}</b></div>`;}
 html+=`<div class="kv" style="box-shadow:0 0 0 2px var(--gold)"><span>Σ</span><b>${fmt(g.coinsRun)}</b></div>`;$('oList').innerHTML=html;
 const nx=nextBolum();const canNext=b&&win&&b.n<BOLUM_N;$('oNext').hidden=!canNext;$('oNext').textContent=T('nextB').replace('{n}',b?Math.min(b.n+1,BOLUM_N):'');
 $('oRetry').textContent=T('retry');$('oRetry').className=canNext?'btn':'btn go';$('oMenu').textContent=T('menu');$('oShare').textContent=T('shareRec');show('over');
 if(b&&win&&b.k===b.cnt&&b.s<STAGES.length-1)setTimeout(()=>toast(T('unlockedNext')+STAGES[b.s+1].name[L]),600);
 if(b&&win&&b.n===FREE_LIMIT&&needFull(FREE_LIMIT+1))setTimeout(()=>openFull(FREE_LIMIT+1),900);
 maybeAskRate(win&&b&&b.n>=5&&(stars===3||b.k===b.cnt));}

function pedal(id,key){const el=$(id);const on=e=>{e.preventDefault();input[key]=1;el.classList.add('down');if(AC&&AC.state==='suspended')AC.resume();},off=e=>{e.preventDefault();input[key]=0;el.classList.remove('down');};
 el.addEventListener('pointerdown',on);el.addEventListener('pointerup',off);el.addEventListener('pointercancel',off);el.addEventListener('pointerleave',off);}
pedal('gas','gas');pedal('brk','brake');
addEventListener('keydown',e=>{if(['ArrowRight','KeyD','ArrowUp','KeyW','Space'].includes(e.code)){input.gas=1;if(state==='play')e.preventDefault();}if(['ArrowLeft','KeyA','ArrowDown','KeyS'].includes(e.code))input.brake=1;if(e.code==='Escape'||e.code==='KeyP'){if(state==='play')$('hPause').onclick();else if(state==='paused')$('pRes').onclick();}if(e.code==='Enter'){if(state==='menu')$('goBtn').onclick();else if(state==='over'){if(!$('oNext').hidden)goNext();else startRun();}}});
addEventListener('keyup',e=>{if(['ArrowRight','KeyD','ArrowUp','KeyW','Space'].includes(e.code))input.gas=0;if(['ArrowLeft','KeyA','ArrowDown','KeyS'].includes(e.code))input.brake=0;});
addEventListener('blur',()=>{input.gas=input.brake=0;});

const CAP=()=>!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());
const PLAT=()=>{try{return window.Capacitor?window.Capacitor.getPlatform():'web';}catch(e){return 'web';}};
const STORE_URL=()=>PLAT()==='android'?'https://play.google.com/store/apps/details?id=com.anduv.yokusyolu':'https://apps.apple.com/app/id6836515355';
let coachCur=null,coachT=0;
function coach(k){if(!game||SAVE.tips[k]||coachCur)return;const map={gas:['cGasT','cGas'],air:['cAirT','cAir'],fuel:game.car.def.fuel==='ev'?['cChargeT','cCharge']:['cFuelT','cFuel'],coin:['cCoinT','cCoin'],mission:['cMisT','cMis']};const m=map[k];if(!m)return;
 coachCur=k;coachT=k==='gas'?999:4;const e=$('coach');e.innerHTML='<b>'+T(m[0])+'</b>'+T(m[1]);e.style.display='block';if(k==='air')game.slow=1.4;if(k!=='gas'){SAVE.tips[k]=1;save();}}
function coachHide(){coachCur=null;const e=document.getElementById('coach');if(e)e.style.display='none';}
function coachTick(dt){const g=game;if(!g)return;
 if(!SAVE.tips.gas&&!coachCur&&g.t>.6)coach('gas');
 if(coachCur==='gas'&&input.gas&&g.dist>8){SAVE.tips.gas=1;save();coachHide();}
 if(g.air>.45&&!g.crashed)coach('air');
 if(g.fuel<.4&&g.fuel>0)coach('fuel');
 if(coachCur&&coachCur!=='gas'){coachT-=dt;if(coachT<=0)coachHide();}
 if(g.crashed&&coachCur)coachHide();}

 const P=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.Share;
 try{if(P&&CAP()){await P.share({title:'Yokuş Yolu',text,url,dialogTitle:'Yokuş Yolu'});return;}if(navigator.share){await navigator.share({title:'Yokuş Yolu',text,url});return;}}catch(e){if(e&&e.name==='AbortError')return;}
 try{await navigator.clipboard.writeText(text+' '+url);toast(T('copied'));}catch(e){toast(url);}}
