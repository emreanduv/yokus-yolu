const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
function hash(n,s){const x=Math.sin(n*127.1+s*311.7)*43758.5453;return x-Math.floor(x);}
function vn(x,s){const i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return hash(i,s)*(1-u)+hash(i+1,s)*u;}
function rn(x,s){return vn(x,s)*.62+vn(x*2.3,s+5)*.26+vn(x*5.1,s+9)*.12;}

class Terrain{
 constructor(st){this.st=st;this.h=[];}
 raw(i){const st=this.st,tp=st.terr,s=st.seed,x=i*SEG;
  if(x<520) return 0;
  const d=x-520, ramp=Math.min(1,d/2600), prog=Math.min(1,d/68000);
  const pa=Math.pow(prog,.8);
  let h=(vn(d/2600,s)-.5)*700*tp.drift*ramp
   +(vn(d/760,s+1)-.5)*(90+300*pa)*tp.mid*ramp
   +(vn(d/240,s+2)-.5)*(30+110*pa)*tp.small*ramp
   +(vn(d/70,s+3)-.5)*(4+16*pa)*tp.bump*ramp;
  if(tp.terrace){const q=h/46,fl=Math.floor(q),fr=q-fl,u=clamp((fr-.25)/.5,0,1),sm=u*u*(3-2*u);h=lerp(h,(fl+sm)*46,.55*ramp);}
  return h;}
 H(i){if(i<0)return 0;let v=this.h[i];if(v===undefined){for(let k=this.h.length;k<=i;k++)this.h[k]=this.raw(k);v=this.h[i];}return v;}
 y(x){const i=Math.floor(x/SEG),t=x/SEG-i;return lerp(this.H(i),this.H(i+1),t);}
 normal(x){const i=Math.floor(x/SEG),dy=this.H(i+1)-this.H(i),l=Math.hypot(SEG,dy);return [-dy/l,SEG/l];}
 closest(px,py){let best=1e9,bx=0,by=0;const i0=Math.floor(px/SEG)-2,i1=Math.floor(px/SEG)+2;
  for(let i=i0;i<=i1;i++){const ax=i*SEG,ay=this.H(i),bxx=ax+SEG,byy=this.H(i+1);const dx=bxx-ax,dy=byy-ay;let t=((px-ax)*dx+(py-ay)*dy)/(dx*dx+dy*dy);t=clamp(t,0,1);const qx=ax+dx*t,qy=ay+dy*t,d=Math.hypot(px-qx,py-qy);if(d<best){best=d;bx=qx;by=qy;}}
  const under=py<this.y(px);let nx,ny;
  if(best<1e-4||under){[nx,ny]=this.normal(px);if(under)best=-best;}else{nx=(px-bx)/Math.abs(best);ny=(py-by)/Math.abs(best);}
  return {d:best,nx,ny};}
}

function ridge(c,w,h,off,base,amp,wl,s,fill,mesa){c.beginPath();c.moveTo(-2,h);for(let x=-2;x<=w+10;x+=8){let n=rn((x+off)/wl,s);if(mesa)n=Math.min(n,mesa)+Math.max(0,n-mesa)*.15;c.lineTo(x,base-n*amp);}c.lineTo(w+10,h);c.closePath();c.fillStyle=fill;c.fill();}
function ridgeY(x,off,base,amp,wl,s,mesa){let n=rn((x+off)/wl,s);if(mesa)n=Math.min(n,mesa)+Math.max(0,n-mesa)*.15;return base-n*amp;}
function tiles(w,off,tw,fn){const k0=Math.floor(off/tw)-1,k1=Math.floor((off+w)/tw)+1;for(let k=k0;k<=k1;k++)fn(k,k*tw-off);}

function update(fdt){
 const g=game,C=g.car;if(g.slow>0){g.slow-=fdt;fdt*=.35;}const N=10,dt=fdt/N;let anyG=0,gas=0,hull=0;
 for(let i=0;i<N;i++){const r=step(dt);anyG|=r.anyG;gas=r.gas;hull|=r.hullHit;}
 g.t+=fdt;
 // fuel
 if(!g.crashed){g.fuel-=fdt*(.22+.78*(input.gas?1:0))/C.sp.tank;if(g.fuel<0)g.fuel=0;}
 const spd=Math.hypot(C.vx,C.vy);
 if(g.fuel<=0&&!g.crashed){g.outT+=fdt;if(spd<25&&g.outT>1.2||g.outT>14){g.crashed=1;g.crashT=.6;g.reason=C.def.fuel==='ev'?'rCharge':'rFuel';}}
 if(g.fuel<.2&&g.fuel>0&&g.t-g.lowWarn>2.5){g.lowWarn=g.t;blip(880,660,.15,'square',.04);}
 // air & flips
 if(!anyG&&!hull){g.air+=fdt;g.rot+=C.w*fdt;}else{if(g.air>.35&&!g.crashed){const fl=Math.floor((Math.abs(g.rot)+.9)/(Math.PI*2));if(fl>0){const b=fl*150;addBonus(T('flip')+(fl>1?' x'+fl:''),b);}if(g.air>1.3){const b=Math.round(g.air*25);addBonus(T('air')+' '+g.air.toFixed(1)+' '+T('sec'),b);}}g.air=0;g.rot=0;}
 coachTick(fdt);
 // distance
 g.dist=Math.max(0,(C.x-START_X)/PXM);g.maxDist=Math.max(g.maxDist,g.dist);
 if(!g.hit1923&&g.maxDist>=1923){g.hit1923=1;addBonus('1923 m',1923);toast(T('m1923'));const i=STAGES.indexOf(g.st);if(i<STAGES.length-1&&!SAVE.stages[STAGES[i+1].id]){SAVE.stages[STAGES[i+1].id]=1;save();setTimeout(()=>toast(T('unlockedNext')+STAGES[i+1].name[L]),1800);}blip(523,1046,.5,'triangle',.1);}
 // pickups
 const near=(x,y,r)=>Math.hypot(C.x-x,C.y-y)<r||C.wheels.some(w=>Math.hypot(w.x-x,w.y-y)<r*.75);
 for(const co of g.coins){if(co.got||Math.abs(co.x-C.x)>160)continue;const cy=g.ter.y(co.x)+(co.big?70:46);if(near(co.x,cy,co.big?70:52)){co.got=1;coach('coin');g.coinsRun+=co.v;blip(co.v>=100?1300:1000,co.v>=100?2200:1700,.09,'square',.035);for(let i=0;i<6;i++)g.parts.push({x:co.x,y:cy,vx:(Math.random()-.5)*200,vy:Math.random()*200,life:.5,max:.5,s:3,col:'#ffe27a',k:'sp'});}}
 for(const f of g.fuels){if(f.got||Math.abs(f.x-C.x)>160)continue;const fy=g.ter.y(f.x)+40;if(near(f.x,fy,60)){f.got=1;g.fuel=1;g.outT=0;pop(C.def.fuel==='ev'?T('chargeUp'):T('fuelUp'),'#8fe36b');blip(520,1040,.2,'triangle',.09);}}
 // particles
 for(const w of C.wheels){if(w.ground&&w.drive&&(Math.abs(w.s*w.r)>140||w.slip>120)&&Math.random()<.6){const col=g.st.id==='agri'?'rgba(255,255,255,':g.st.id==='pamukkale'?'rgba(240,240,232,':'rgba('+(g.st.ground.grass===1?'110,85,60,':'200,165,115,');g.parts.push({x:w.x-w.r*.6,y:w.y-w.r*.8,vx:-Math.sign(w.s)*(60+Math.random()*120)+C.vx*.2,vy:40+Math.random()*120,life:.7,max:.7,s:5+Math.random()*7,col,k:'dust'});}}
 if(input.gas&&!g.crashed&&C.def.fuel==='gas'&&g.fuel>0&&Math.random()<.5){const ca=Math.cos(C.a),sa=Math.sin(C.a);const ex=C.id==='toprak'?32:-84,ey=C.id==='toprak'?32:-14;g.parts.push({x:C.x+ca*ex-sa*ey,y:C.y+sa*ex+ca*ey,vx:C.vx*.3-ca*40+(C.id==='toprak'?0:-30),vy:C.vy*.3+60,life:.9,max:.9,s:4,col:'rgba(90,90,95,',k:'smoke'});}
 if(g.st.snow&&Math.random()<.8)g.parts.push({x:g.cam.x+(Math.random()-.3)*W/S0,y:g.cam.y+H/S0*.6,vx:-30-Math.random()*40,vy:-60-Math.random()*50,life:6,max:6,s:2+Math.random()*2,col:'snow',k:'snow'});
 for(const p of g.parts){p.life-=fdt;p.x+=p.vx*fdt;p.y+=p.vy*fdt;if(p.k==='dust'||p.k==='smoke'){p.vx*=.96;p.vy*=.96;p.s+=fdt*14;}if(p.k==='sp')p.vy-=600*fdt;}

 for(const p of g.pops)p.life-=fdt;g.pops=g.pops.filter(p=>p.life>0);
 // camera

 // sound

 if(g.crashed){g.crashT+=fdt;if(g.crashT>1.6&&!g.over){g.over=1;endRun();}}
}

  STAGES.forEach((st,i)=>{const own=!!SAVE.stages[st.id];const d=document.createElement('div');d.className='card'+(SAVE.sel.stage===st.id?' sel':'');
   const cvv=document.createElement('canvas');cvv.width=420;cvv.height=224;d.appendChild(cvv);thumbStage(cvv,st);
   const ci=document.createElement('div');ci.className='ci';ci.innerHTML=`<div class="nm">${st.name[L]}</div><div class="sb">${st.sub[L]}</div><div class="sb" style="margin-top:4px;color:#ffe9a8">${T('best')}: ${Math.floor(SAVE.best[st.id]||0)} m ${((SAVE.best[st.id]||0)>=1923)?'· 1923 ✓':''}</div>`;
   if(!own){const lk=document.createElement('div');lk.className='lk';lk.textContent='🔒';d.appendChild(lk);const b=document.createElement('button');b.className='btn gold'+(SAVE.coins<st.price?' dis':'');b.style.cssText='margin-top:6px;width:100%;font-size:15px;padding:6px';b.textContent=`${T('unlock')} · ${fmt(st.price)}`;b.onclick=e=>{e.stopPropagation();if(SAVE.coins>=st.price){SAVE.coins-=st.price;SAVE.stages[st.id]=1;SAVE.sel.stage=st.id;save();blip(500,1000,.2,'triangle',.08);renderMenu();}};ci.appendChild(b);
    const n=document.createElement('div');n.className='sb';n.style.fontSize='11px';n.textContent=i>0?`${T('need')} ${fmt(st.price)}`:'';ci.insertBefore(n,b);}
   d.appendChild(ci);d.onclick=()=>{if(own){SAVE.sel.stage=st.id;save();renderMenu();}};wrap.appendChild(d);});

  const note=document.createElement('div');note.className='sb';note.style.cssText='padding:8px 2px;color:#9fb2cf;font-size:12px';note.textContent=L==='tr'?'Her sahnede hedef 1923 m: ulaşınca 1923 akçe ödül ve bir sonraki sahne açılır.':'Every stage’s goal is 1923 m: reach it for a 1923 akçe reward and the next stage unlocks.';ct.appendChild(note);}
 else if(tab==='car'){const wrap=document.createElement('div');wrap.className='cards';
  CARS.forEach(car=>{const own=!!SAVE.cars[car.id];const d=document.createElement('div');d.className='card'+(SAVE.sel.car===car.id?' sel':'');
   const cvv=document.createElement('canvas');cvv.width=420;cvv.height=224;cvv.style.background='linear-gradient(180deg,#2b405f,#16223a)';d.appendChild(cvv);thumbCar(cvv,car);
   const sp=spec(car);const bar=(lab,v)=>`<div class="stat"><span>${lab}</span><div class="bar"><i style="width:${clamp(v,0.05,1)*100}%"></i></div></div>`;
   const ci=document.createElement('div');ci.className='ci';ci.innerHTML=`<div class="nm">${car.name} <span style="font-size:14px;color:#9fb2cf">${car.year}</span></div><div class="sb">${car.desc[L]}</div>`+
    bar(T('power'),sp.F*(car.wheels.filter(w=>w.drive).length)/car.m/2200)+bar(T('speed'),sp.spin*car.wheels[0].r/1500)+bar(T('grip'),sp.mu/1.6)+bar(car.fuel==='ev'?T('battery'):T('tank'),sp.tank/50);
   const b=document.createElement('button');b.style.cssText='margin-top:7px;width:100%;font-size:15px;padding:6px';
   if(own){b.className='btn'+(SAVE.sel.car===car.id?' dis':'');b.textContent=SAVE.sel.car===car.id?T('selected'):T('select');}else{b.className='btn gold'+(SAVE.coins<car.price?' dis':'');b.textContent=`${T('buy')} · ${fmt(car.price)}`;}
   b.onclick=e=>{e.stopPropagation();if(!own){if(SAVE.coins>=car.price){SAVE.coins-=car.price;SAVE.cars[car.id]=1;SAVE.sel.car=car.id;save();blip(500,1000,.2,'triangle',.08);}}else SAVE.sel.car=car.id;save();renderMenu();};
   ci.appendChild(b);d.appendChild(ci);d.onclick=()=>{if(own){SAVE.sel.car=car.id;save();renderMenu();}};wrap.appendChild(d);});
  ct.appendChild(wrap);
  const note=document.createElement('div');note.className='sb';note.style.cssText='padding:8px 2px;color:#9fb2cf;font-size:12px';note.textContent=T('driver');ct.appendChild(note);}
 else{const car=carById(SAVE.sel.car),u=upgOf(car.id);
  const hd=document.createElement('div');hd.className='ghead';const cvv=document.createElement('canvas');cvv.width=360;cvv.height=192;thumbCar(cvv,car);hd.appendChild(cvv);
  const inf=document.createElement('div');inf.innerHTML=`<div class="nm" style="font-family:'Barlow Condensed';font-weight:800;font-size:26px">${car.name}</div><div class="sb" style="color:#9fb2cf;font-size:13px">${car.desc[L]}</div>`;hd.appendChild(inf);ct.appendChild(hd);
  const tbl=document.createElement('div');
  const names={engine:T('engine'),susp:T('susp'),tires:T('tires'),tank:car.fuel==='ev'?T('battery'):T('tank')},effs={engine:T('effE'),susp:T('effS'),tires:T('effT'),tank:T('effF')};
  UPG.forEach(k=>{const r=document.createElement('div');r.className='row';const cost=upgCost(car,k);
   r.innerHTML=`<div class="pn">${names[k]}</div><div class="pips">${[0,1,2,3,4].map(i=>`<i class="${i<u[k]?'on':''}"></i>`).join('')}</div><div class="eff">${effs[k]}</div>`;
   const b=document.createElement('button');b.className='btn gold'+(cost===null||SAVE.coins<cost?' dis':'');b.style.cssText='font-size:15px;padding:6px 12px;min-width:92px';b.textContent=cost===null?T('max'):fmt(cost);
   b.onclick=()=>{if(cost!==null&&SAVE.coins>=cost){SAVE.coins-=cost;u[k]++;save();blip(400,900,.2,'triangle',.08);renderMenu();}};r.appendChild(b);tbl.appendChild(r);});
  ct.appendChild(tbl);}
}
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(()=>e.style.display='none',2600);}

function startRun(){audioInit();if(AC&&AC.state==='suspended')AC.resume();newGame();state='play';show(null);$('gasT').textContent=T('gas');$('brkT').textContent=T('brake');$('rot').textContent=T('rotate');lastT=performance.now();}
function endRun(){const g=game;engineSet(false,0,0);
 const rec=g.maxDist>(SAVE.best[g.st.id]||0);if(rec)SAVE.best[g.st.id]=g.maxDist;SAVE.coins+=g.coinsRun;save();
 state='over';$('oH').textContent=T('over');$('oStage').textContent=g.st.name[L];$('oDist').textContent=Math.floor(g.maxDist)+' m';
 $('oReason').textContent=T(g.reason||'rFuel')+(rec?'  ·  '+T('newRec'):'');
 let html=`<div class="kv"><span>${T('coins')}</span><b>${fmt(g.coinsRun-g.bonus.reduce((a,b)=>a+b[1],0))}</b></div>`;
 if(g.bonus.length){const agg={};g.bonus.forEach(([n,v])=>{const key=n.replace(/ [\d.]+ (sn|s)$/,'');agg[key]=(agg[key]||0)+v;});for(const k in agg)html+=`<div class="kv"><span>${k}</span><b>+${fmt(agg[k])}</b></div>`;}
 html+=`<div class="kv" style="background:#2a3a20"><span>Σ</span><b>${fmt(g.coinsRun)}</b></div>`;$('oList').innerHTML=html;
 $('oRetry').textContent=T('retry');$('oMenu').textContent=T('menu');$('oShare').textContent=T('shareRec');show('over');maybeAskRate((rec&&g.maxDist>=400)||g.hit1923);}

function setLang(l){L=l;SAVE.lang=l;save();document.documentElement.lang=l;$('pH').textContent=T('paused');$('pRes').textContent=T('resume');$('pRetry').textContent=T('retry');$('pMenu').textContent=T('menu');$('pHelp').textContent=T('help');$('bShare').textContent='➜ '+T('share');}
document.querySelectorAll('#lang .btn').forEach(b=>b.onclick=()=>{setLang(b.dataset.l);audioInit();state='menu';show('menu');renderMenu();});
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{tab=t.dataset.t;renderMenu();});
$('goBtn').onclick=startRun;
const sndT=()=>{SAVE.muted=!SAVE.muted;save();$('mSnd').textContent=$('hSnd').textContent=SAVE.muted?'🔇':'🔊';};$('mSnd').onclick=sndT;$('hSnd').onclick=sndT;
$('hPause').onclick=()=>{if(state==='play'){state='paused';engineSet(false,0,0);show('pause');}};
$('pRes').onclick=()=>{state='play';show(null);lastT=performance.now();};
$('pRetry').onclick=startRun;$('oRetry').onclick=startRun;
const toMenu=()=>{engineSet(false,0,0);state='menu';show('menu');renderMenu();};$('pMenu').onclick=toMenu;$('oMenu').onclick=toMenu;
function pedal(id,key){const el=$(id);const on=e=>{e.preventDefault();input[key]=1;el.classList.add('down');if(AC&&AC.state==='suspended')AC.resume();},off=e=>{e.preventDefault();input[key]=0;el.classList.remove('down');};
 el.addEventListener('pointerdown',on);el.addEventListener('pointerup',off);el.addEventListener('pointercancel',off);el.addEventListener('pointerleave',off);}
pedal('gas','gas');pedal('brk','brake');
addEventListener('keydown',e=>{if(['ArrowRight','KeyD','ArrowUp','KeyW','Space'].includes(e.code)){input.gas=1;if(state==='play')e.preventDefault();}if(['ArrowLeft','KeyA','ArrowDown','KeyS'].includes(e.code))input.brake=1;if(e.code==='Escape'||e.code==='KeyP'){if(state==='play')$('hPause').onclick();else if(state==='paused')$('pRes').onclick();}if(e.code==='Enter'&&(state==='menu'||state==='over'))startRun();});
addEventListener('keyup',e=>{if(['ArrowRight','KeyD','ArrowUp','KeyW','Space'].includes(e.code))input.gas=0;if(['ArrowLeft','KeyA','ArrowDown','KeyS'].includes(e.code))input.brake=0;});
addEventListener('blur',()=>{input.gas=input.brake=0;});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')$('hPause').onclick();});

/* ================= REHBER, AYARLAR, PUAN, PAYLAŞ, GÖRÜŞ ================= */
const CAP=()=>!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());
const PLAT=()=>{try{return window.Capacitor?window.Capacitor.getPlatform():'web';}catch(e){return 'web';}};
const STORE_URL=()=>PLAT()==='android'?'https://play.google.com/store/apps/details?id=com.anduv.yokusyolu':'https://apps.apple.com/app/id6836515355';
let coachCur=null,coachT=0;
function coach(k){if(!game||SAVE.tips[k]||coachCur)return;const map={gas:['cGasT','cGas'],air:['cAirT','cAir'],fuel:game.car.def.fuel==='ev'?['cChargeT','cCharge']:['cFuelT','cFuel'],coin:['cCoinT','cCoin']};const m=map[k];if(!m)return;
 coachCur=k;coachT=k==='gas'?999:4;const e=$('coach');e.innerHTML='<b>'+T(m[0])+'</b>'+T(m[1]);e.style.display='block';if(k==='air')game.slow=1.4;if(k!=='gas'){SAVE.tips[k]=1;save();}}
function coachHide(){coachCur=null;const e=document.getElementById('coach');if(e)e.style.display='none';}
function coachTick(dt){const g=game;if(!g)return;
 if(!SAVE.tips.gas&&!coachCur&&g.t>.6)coach('gas');
 if(coachCur==='gas'&&input.gas&&g.dist>8){SAVE.tips.gas=1;save();coachHide();}
 if(g.air>.45&&!g.crashed)coach('air');
 if(g.fuel<.4&&g.fuel>0)coach('fuel');
 if(coachCur&&coachCur!=='gas'){coachT-=dt;if(coachT<=0)coachHide();}
 if(g.crashed&&coachCur)coachHide();}
function openUrl(u){try{const w=window.open(u,'_blank');if(!w)location.href=u;}catch(e){location.href=u;}}
async function shareGame(rec){const text=rec?T('shareText')+Math.floor(rec)+' m':(L==='tr'?'Yokuş Yolu: Keloğlan ile yerli klasiklerle yokuş tırman!':'Yokuş Yolu: climb hills with Keloğlan in classic Turkish cars!');const url=STORE_URL();
 const P=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.Share;
 try{if(P&&CAP()){await P.share({title:'Yokuş Yolu',text,url,dialogTitle:'Yokuş Yolu'});return;}if(navigator.share){await navigator.share({title:'Yokuş Yolu',text,url});return;}}catch(e){if(e&&e.name==='AbortError')return;}
 try{await navigator.clipboard.writeText(text+' '+url);toast(T('copied'));}catch(e){toast(url);}}
/* Görüş adresi derlemede iletisim.js'e repo değişkeni FEEDBACK_MAIL'den yazılır */
function feedback(){const to=window.FEEDBACK_MAIL||'';const prog=STAGES.map(st=>st.id+':'+Math.floor(SAVE.best[st.id]||0)).join(', ');const sub='Yokuş Yolu '+VERSION+' — '+(L==='tr'?'Görüş':'Feedback');
 const body=(L==='tr'?'Merhaba,\n\n\n\n— Bilgi (silmeyin) —\n':'Hi,\n\n\n\n— Info (please keep) —\n')+'Sürüm/Version: '+VERSION+'\nPlatform: '+PLAT()+' · '+navigator.userAgent+'\nAraç/Car: '+SAVE.sel.car+' · Sahne/Stage: '+SAVE.sel.stage+'\nRekorlar/Records: '+prog;
 location.href='mai'+'lto:'+to+'?subject='+encodeURIComponent(sub)+'&body='+encodeURIComponent(body);}
async function rateNow(){SAVE.rated=1;save();const R=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.InAppReview;
 if(R&&CAP()){try{await R.requestReview();return;}catch(e){}}openUrl(STORE_URL());}
function maybeAskRate(meaningful){const b=$('rateBox');b.style.display='none';if(!meaningful||!CAP()||SAVE.rated||SAVE.rateAsks>=2)return;SAVE.rateAsks++;save();
 $('rbQ').textContent=T('rateQ');$('rbYes').textContent=T('rateYes');$('rbFeed').textContent=T('rateFeed');$('rbLater').textContent=T('later');b.style.display='block';}
$('rbYes').onclick=()=>{$('rateBox').style.display='none';rateNow();};$('rbFeed').onclick=()=>{$('rateBox').style.display='none';SAVE.rated=1;save();feedback();};$('rbLater').onclick=()=>{$('rateBox').style.display='none';};
let eraseArm=0;
function eraseData(){if(!eraseArm){eraseArm=1;setTimeout(()=>{eraseArm=0;$('setErase').textContent=T('erase');},4000);return false;}
 try{localStorage.removeItem(SKEY);}catch(e){}SAVE={lang:null,coins:0,stages:{kapadokya:1},cars:{devran:1},upg:{},best:{},sel:{stage:'kapadokya',car:'devran'},muted:false,tips:{},rateAsks:0,rated:0};eraseArm=0;return true;}
let backTo='menu';
function openSettings(){backTo=state==='paused'?'pause':'menu';fillSettings();show('setp');}
function fillSettings(){$('sH').textContent=T('settings');$('sLangL').textContent=T('language');$('sSndL').textContent=T('sound');$('sSnd').textContent=SAVE.muted?T('off'):T('on');
 $('sHelpL').textContent=T('help');$('sHelp').textContent=T('open');$('sRateL').textContent=T('rateL');$('setRate').textContent=T('rate');$('sFeedL').textContent=T('feedL');$('setFeed').textContent=T('feed');
 $('sShareL').textContent=T('share');$('sShare').textContent=T('open');$('sEraseL').textContent=T('eraseL');$('setErase').textContent=T('erase');$('sVer').textContent=T('version')+' '+VERSION;
 $('rowRate').style.display=CAP()?'flex':'none';document.querySelectorAll('[data-sl]').forEach(b=>b.classList.toggle('gold',b.dataset.sl===L));}

 let h=HELP[L].map(([a,b])=>`<div class="tip"><div><b>${a}</b><br>${b}</div></div>`).join('');

$('sClose').onclick=closeSub;$('hClose').onclick=closeSub;
$('sSnd').onclick=()=>{sndT();fillSettings();};$('setRate').onclick=rateNow;$('setFeed').onclick=feedback;$('sShare').onclick=()=>shareGame(0);$('bShare').onclick=()=>shareGame(0);

let attract=null;
function loop(now){const dt=Math.min(.033,(now-lastT)/1000);lastT=now;
 if(state==='play'){update(dt);render();}
 else if(state==='paused'||state==='over'){if(game)render();}
 else{menuT+=dt;const st=stageById(SAVE.sel.stage);if(!attract||attract.st!==st)attract={st,ter:new Terrain(st)};const S=viewScale(),camX=600+menuT*120,camY=attract.ter.y(camX)+60;drawBG(cx,st,W,H,camX,camY,S,menuT);drawTerrain(cx,attract.ter,st,W,H,null,S,camX,camY,W*.4,H*.62);cx.fillStyle='rgba(8,12,22,.35)';cx.fillRect(0,0,W,H);}
 if(state==='play')$('rot').style.display=H>W?'block':'none';
 requestAnimationFrame(loop);}

show('lang');
try{['800 20px "Barlow Condensed"','700 20px "Barlow Condensed"','600 20px Rubik','400 20px Rubik'].forEach(f=>document.fonts.load(f,'ıİşŞğĞçÇöÖüÜ'));}catch(e){}
requestAnimationFrame(loop);
